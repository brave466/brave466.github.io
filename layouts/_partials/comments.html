{{- $p := .page }}{{ $c := .cfg }}
<section class="comments" id="comments" aria-labelledby="comments-h">
  <p class="cm-head" id="comments-h"><span class="cm-hash" aria-hidden="true">##</span> COMMENTS</p>
  <p class="cm-note">sign in with Google, Facebook, X or email &middot; tick &ldquo;anonymous&rdquo; to hide your name &middot; comments are moderated</p>
  <div class="cm-thread" data-cb
       data-cb-project="{{ $c.projectId }}"
       data-cb-url="{{ $p.Permalink }}"
       data-cb-sort="{{ $c.sortOrder | default "newest" }}">
    <p class="cm-status" data-cm-status>&gt; comments load when you scroll here<span class="cm-cursor" aria-hidden="true">_</span></p>
    <div class="commentbox" id="commentbox"></div>
  </div>
  <noscript><p class="cm-status">&gt; comments need JavaScript.</p></noscript>
</section>
