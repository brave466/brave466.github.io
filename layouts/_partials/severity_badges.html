{{- /* Compact bracket severity tags, e.g. [HIGH]. Context: page */ -}}
{{- with .GetTerms "severity" -}}
<span class="sev-badges">
  {{- range . -}}
  <a class="sev sev-{{ .Title | lower | urlize }}" href="{{ .RelPermalink }}" title="Severity: {{ .Title }}">[{{ upper .Title }}]</a>
  {{- end -}}
</span>
{{- end -}}
