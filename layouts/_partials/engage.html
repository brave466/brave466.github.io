{{- /* Like button for write-ups. Renders only when [params.likes] key is set in hugo.toml. */ -}}
{{- $likes := site.Params.likes | default dict }}
{{- if and $likes.key (eq ($likes.provider | default "lyket") "lyket") }}
{{- partial "likes.html" (dict "page" . "cfg" $likes) }}
<script src="{{ "js/engage.js" | relURL }}" defer></script>
{{- end }}
