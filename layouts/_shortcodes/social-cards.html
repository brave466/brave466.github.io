{{- /* Profile links as a plain mono table. Uses site.Params.socialIcons (skips RSS). */ -}}
<ul class="links">
{{- range site.Params.socialIcons }}
  {{- if ne .name "rss" }}
  {{- $label := .title | default (.name | lower) }}
  <li><a href="{{ .url | safeURL }}" target="_blank" rel="noopener noreferrer me"><span class="l-name">{{ $label }}</span><span class="l-url">{{ replaceRE "^https?://" "" .url }}</span><span class="l-arrow" aria-hidden="true">-&gt;</span></a></li>
  {{- end }}
{{- end }}
</ul>
