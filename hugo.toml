# Site URL (GitHub Pages user site).
baseURL = "https://brave466.github.io/"
languageCode = "en-us"
title = "brave"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  severity = "severity"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON index powers Fuse.js search

[markup]
  [markup.highlight]
    noClasses = false      # use CSS classes; styles live in assets/css/extended/syntax.css
    codeFences = true
    guessSyntax = true
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  env = "production"
  description = "Bug bounty write-ups and AppSec notes by Alexander Inkoom."
  author = "Alexander Inkoom"
  defaultTheme = "dark"
  disableThemeToggle = true   # neon design is dark-only
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false
  DateFormat = "January 2, 2006"
  mainSections = ["posts"]

  [params.assets]
    theme_color = "#0b0b0a"
    msapplication_TileColor = "#0b0b0a"

  [params.homeInfoParams]
    Title = "brave"
    Content = "Field notes from breaking\nweb apps and APIs."   # \n = line break in the hero

  # Homepage hero (man-page style). Edit freely.
  [params.hero]
    prompt = "brave@bounty:~$"
    handle = "brave"
    focus = "api security · web apps · secure code review · n-day research"
    since = "2026"

  # Scrolling ticker between hero and index (part of [params.hero])
  ticker = ["IDOR", "BOLA", "SSRF", "XSS", "AUTH BYPASS", "SQLI"]

  # Guest comments (Cusdis). Paste the App ID from the Cusdis dashboard to
  # enable; empty = the comments section is not rendered at all.
  [params.cusdis]
    appId = ""
    host = "https://cusdis.com"   # or your self-hosted Cusdis URL
    theme = "dark"

  # Like button (Lyket). Paste your PUBLIC API key to enable; empty = hidden.
  [params.likes]
    provider = "lyket"
    key = ""
    namespace = "brave"
    anonymous = false   # true = no localStorage id, Lyket dedupes by IP only

  [params.footer]
    text = "<span class=\"eof\">&#45;&#45; EOF &#45;&#45;</span>"

  # Profile links (homepage icons + About page list)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/brave466"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/alexander-inkoom"
  [[params.socialIcons]]
    name = "medium"
    url = "https://medium.com/@brave___"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    name = "Write-ups"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    name = "Severity"
    url = "/severity/"
    weight = 30
  [[menu.main]]
    name = "Archives"
    url = "/archives/"
    weight = 40
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 50
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 60
